name: Sync Upstream heydemoura (Solo manual a main)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and fast-forward main with upstream
        run: |
          git remote add upstream https://github.com/heydemoura/PS5_Longshot.git
          git fetch upstream main
          git merge --ff-only upstream/main
          git push origin main
